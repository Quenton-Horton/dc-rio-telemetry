apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-telemetry-worker
  namespace: lifestyle-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-engine
  template:
    metadata:
      labels:
        app: telemetry-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: telemetry-engine
        image: dc-rio-telemetry:v16
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 2112
          name: metrics
        - containerPort: 8080
          name: web
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        env:
        - name: DB_HOST
          value: "postgres-svc"
        - name: REDIS_HOST
          value: "redis-svc:6379"
        - name: SERPAPI_KEY
          valueFrom:
            secretKeyRef:
              name: serpapi-secret
              key: api-key
        - name: CF_TEAM_DOMAIN
          value: "https://shrill-sun-2a50.cloudflareaccess.com"
        - name: CF_POLICY_AUD
          value: "8ba411a5721aaa8b60250a20313e470d079247926eb8ae6df78e2e5adc474344"
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-secret
              key: token
        resources:
          requests:
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      restartPolicy: Always