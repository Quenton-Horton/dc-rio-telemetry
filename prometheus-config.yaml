apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: lifestyle-telemetry
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'logistics-telemetry-engine'
        static_configs:
          - targets: ['logistics-telemetry-svc.lifestyle-telemetry.svc.cluster.local:2112']
