apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightweight-prometheus
  namespace: lifestyle-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightweight-prometheus
  template:
    metadata:
      labels:
        app: lightweight-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-server-conf
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: lifestyle-telemetry
spec:
  type: ClusterIP
  selector:
    app: lightweight-prometheus
  ports:
  - port: 9090
    targetPort: 9090
